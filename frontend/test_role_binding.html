<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>測試 Role 綁定</title>
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; }
        .selected { background: #3b82f6; color: white; }
        label { display: block; padding: 10px; margin: 5px; border: 2px solid #ccc; cursor: pointer; }
        input[type="radio"] { margin-right: 10px; }
    </style>
</head>
<body>
    <div id="app">
        <h1>測試 Role 選擇綁定</h1>
        
        <div>
            <h3>當前選擇的 role: <strong>{{ registerForm.role }}</strong></h3>
        </div>
        
        <div>
            <label :class="{ selected: registerForm.role === 'user' }">
                <input v-model="registerForm.role" type="radio" value="user">
                一般用戶
            </label>
            
            <label :class="{ selected: registerForm.role === 'vendor' }">
                <input v-model="registerForm.role" type="radio" value="vendor">
                廠商
            </label>
        </div>
        
        <button @click="testSubmit" style="margin-top: 20px; padding: 10px 20px; font-size: 16px;">
            測試提交
        </button>
        
        <div v-if="submitted" style="margin-top: 20px; padding: 10px; background: #e0f7e0; border: 2px solid #4caf50;">
            <h3>提交的資料：</h3>
            <pre>{{ submittedData }}</pre>
        </div>
    </div>

    <script>
        const { createApp } = Vue
        
        createApp({
            data() {
                return {
                    registerForm: {
                        role: 'user'  // 預設值
                    },
                    submitted: false,
                    submittedData: null
                }
            },
            methods: {
                testSubmit() {
                    const finalRole = this.registerForm.role || 'user'
                    this.submittedData = {
                        originalRole: this.registerForm.role,
                        finalRole: finalRole,
                        timestamp: new Date().toISOString()
                    }
                    this.submitted = true
                    console.log('提交的 role:', finalRole)
                }
            },
            watch: {
                'registerForm.role'(newVal) {
                    console.log('Role 改變了:', newVal)
                }
            }
        }).mount('#app')
    </script>
</body>
</html>
