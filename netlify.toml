[build]
  base = "frontend"
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

# Vue Router SPA：所有路徑都導回 index.html
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# 環境變數需要在 Netlify UI 中設定：
# - VITE_FIREBASE_API_KEY
# - VITE_FIREBASE_AUTH_DOMAIN
# - VITE_FIREBASE_PROJECT_ID
# - VITE_FIREBASE_STORAGE_BUCKET
# - VITE_FIREBASE_MESSAGING_SENDER_ID
# - VITE_FIREBASE_APP_ID
# - VITE_FIREBASE_MEASUREMENT_ID
# - VITE_API_BASE_URL（設為你後端的 URL，例如 https://tripmate-backend.zeabur.app）
# - VITE_GEMINI_API_KEY
# - VITE_GOOGLE_MAPS_API_KEY
# - VITE_WS_BASE_URL

